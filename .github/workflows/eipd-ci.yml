name: EIPD CPU unit tests
on:
  push:
    branches: [feat/eipd-data-and-latent-training]
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Python syntax
        run: python -m compileall -q vep_opsd tests
      - name: EIPD independent unit tests
        run: python -m unittest discover -s tests -p 'test_eipd*.py' -v
