[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-vep-opsd"
version = "0.1.0"
description = "Hindsight-guided on-policy self-distillation for video event prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.10.1",
  "decord==0.6.0",
  "deepspeed==0.18.2",
  "numpy==1.26.4",
  "Pillow>=10.0",
  "qwen-vl-utils==0.0.14",
  "torch>=2.6.0",
  "transformers==4.57.1",
]

[tool.setuptools.packages.find]
include = ["vep_opsd*"]

